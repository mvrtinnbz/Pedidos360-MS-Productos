spring.application.name=ms-productos

# ===============================
# MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/pedidos360_productos
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# SERVIDOR
# ===============================

server.port=8081

# ===============================
# AZURE ENTRA ID
# ===============================

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/0844a9ad-f458-47d0-8036-0f2080309ddc/v2.0

# ===============================
# RABBITMQ (consume orden.creada desde productos.stock.queue)
# En AWS se sobrescribe con SPRING_RABBITMQ_HOST = IP privada de la EC2 de Orders
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# ===============================
# KAFKA (publica eventos de interaccion en el topico tienda.eventos)
# En AWS: variable de entorno SPRING_KAFKA_BOOTSTRAP_SERVERS
# ===============================

spring.kafka.bootstrap-servers=localhost:9092
# Si Kafka no responde, no bloquear la peticion mas de 3 segundos
spring.kafka.producer.properties.max.block.ms=3000